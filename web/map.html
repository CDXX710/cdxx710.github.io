<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="../img/svg/logos/ifl_logo.svg" background="white" />
		<title>Caribbean Archives</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

		<link rel="stylesheet" href="../css/shared.css" />
		<link rel="stylesheet" href="../css/map/root.css" />

		<script src="../js/map/state/time-slider-algebra.js"></script>
		<script src="../js/map/data/topojson.js"></script>
	</head>

	<body>
		<header class="site-header">
			<img class="site-header__logo" src="../img/svg/logos/ifl_logo.svg" />
			<h1 class="site-header__title">Caribbean Archives</h1>
			<div class="site-header__divider" aria-hidden="true"></div>
			<p class="site-header__sub">Illustrative data only</p>
			<a class="map-header__back" href="../index.html">
				<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<polyline points="9,2 4,7 9,12" />
				</svg>
				Index
			</a>
		</header>

		<main id="map" aria-label="Archive map">
			<div class="zoom-panel" id="zoom-panel">
				<button type="button" class="zoom-button" id="zoom-panel__in-btn">+</button>
				<button type="button" class="zoom-button" id="zoom-panel__out-btn">−</button>
			</div>

			<div class="basemap-panel" id="basemap-panel" aria-label="Basemap selector">
				<div class="basemap-panel__row" id="basemap-panel__base-row" role="radiogroup" aria-label="Choose base map"></div>
				<div class="basemap-panel__row basemap-panel__row--overlay" id="basemap-panel__overlay-row" role="group" aria-label="Toggle historical map overlay"></div>
			</div>

			<div class="legend-panel is-collapsed" id="legend-panel" aria-label="Map legend">
				<div class="legend-panel__header" id="legend-panel__header"></div>
				<div class="legend-panel__collapse" id="legend-panel__collapse" data-collapsed="true">
					<div class="legend-panel__body" id="legend-panel__body">
						<div class="divider" role="separator"></div>
						<div class="legend__actions">
							Toggle all:
							<button type="button" class="legend-panel__action-btn" id="legend-panel__all-on-btn" aria-label="Show all features">ON</button>
							<button type="button" class="legend-panel__action-btn" id="legend-panel__all-off-btn" aria-label="Hide all features">OFF</button>
						</div>
						<div class="divider" role="separator"></div>
						<div class="legend-panel__content" id="legend-panel__groups"></div>
					</div>
				</div>
			</div>

			<div class="analytics-panel" id="analytics-panel" aria-label="Analytics summary">
				<div class="analytics-panel__header" id="analytics-panel__header"></div>
				<div class="analytics-panel__collapse" id="analytics-panel__collapse" data-collapsed="false">
					<div class="analytics-panel__body" id="analytics-panel__body">
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__records"></div>
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__islands"></div>
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__timeline"></div>
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__creole-roles"></div>
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__categories"></div>
						<div class="divider" role="separator"></div>
						<div class="analytics-section" id="analytics-panel__author-types"></div>
					</div>
				</div>
			</div>

			<div class="searchbar-panel" id="searchbar-panel" role="search">
				<button type="button" id="searchbar-panel__trigger" class="searchbar__shell" aria-label="Open search" aria-expanded="false">
					<svg class="searchbar__vector" id="searchbar-panel__vector" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path class="searchbar__outline" id="searchbar-panel__outline" vector-effect="non-scaling-stroke"></path>
						<line class="searchbar__handle" id="searchbar-panel__handle" vector-effect="non-scaling-stroke"></line>
					</svg>
					<input type="text" id="searchbar-panel__field" name="field-box" placeholder="   Search..." aria-label="Search archive" autocomplete="off" />
				</button>
				<button type="button" id="searchbar-panel__clear-btn" class="searchbar__clear" aria-label="Clear search" tabindex="-1">✕</button>
				<div class="searchbar__measure" id="searchbar-panel__measure" aria-hidden="true"></div>
			</div>

			<div id="select-toolbar-panel" aria-label="Selection tools">
				<div class="select-toolbar" id="select-toolbar">
					<div class="select-toolbar__modes" id="select-toolbar__modes">
						<div class="select-toolbar__row" role="radiogroup" aria-label="Selection combine mode">
							<button type="button" class="select-toolbar__btn is-active" data-mode="new" title="New selection" aria-label="New selection">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<circle cx="9.5" cy="13.5" r="6.5" fill="currentColor" />
									<circle cx="15" cy="9" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-mode="add" title="Union" aria-label="Union">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<circle cx="9.5" cy="13.5" r="6.5" fill="currentColor" />
									<circle cx="15" cy="9" r="5" fill="currentColor" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-mode="subtract" title="Subtract" aria-label="Subtract">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<mask id="subtract-mask-1">
										<circle cx="9.5" cy="13.5" r="6.5" fill="white" />
										<circle cx="15" cy="9" r="5.4" fill="black" />
									</mask>
									<circle cx="9.5" cy="13.5" r="6.5" fill="currentColor" mask="url(#subtract-mask-1)" />
									<circle cx="15" cy="9" r="5.4" fill="none" stroke="currentColor" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-mode="intersect" title="Intersect" aria-label="Intersect">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<mask id="intersect-mask-1">
										<circle cx="15" cy="9" r="6.3" fill="white" />
									</mask>
									<circle cx="9.5" cy="13.5" r="6.3" fill="currentColor" mask="url(#intersect-mask-1)" />
									<circle cx="9.5" cy="13.5" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4" />
									<circle cx="15" cy="9" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4" />
								</svg>
							</button>
						</div>
					</div>

					<div class="select-toolbar__tools">
						<div class="select-toolbar__row">
							<button type="button" class="select-toolbar__btn" data-shape="rectangle" title="Rectangle" aria-label="Rectangle">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<rect x="3.5" y="6.5" width="17" height="11" rx="1" stroke-dasharray="3 2.4" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-shape="ellipse" title="Ellipse" aria-label="Ellipse">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
									<ellipse cx="12" cy="12" rx="8.5" ry="6" stroke-dasharray="3 2.4" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-shape="lasso" title="Lasso" aria-label="Lasso">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<path d="M12.2 4c4.4 0 7.8 2.6 7.8 6s-3.4 6-7.8 6c-1 0-1.9-.1-2.7-.4-.3 1-1 2.2-2.2 2.6.4-1 .5-2 .3-2.8C6 14.6 4.4 12.4 4.4 10c0-3.4 3.4-6 7.8-6z" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" data-shape="polygon" title="Polygon (click to place points, double-click to close)" aria-label="Polygon">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
									<path d="M5 9.5 7.8 5l3 3 3.7-3.6 3.8 4.6-2.7 2.8 1.8 2.8-3.6 1-1 3-2.7-2-2.8 1.8-1-3.6-3-1z" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn" id="select-toolbar__object-btn" data-shape="object" title="Object (click a boundary)" aria-label="Object select">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
									<path d="M4 14c0-5 3-9 8-9s8 4 8 9-3 6-8 6-8-1-8-6z" />
									<circle cx="12" cy="13" r="1.6" fill="currentColor" stroke="none" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn select-toolbar__objectmode-btn" data-object-mode="boundaries" title="Using the object's inside boundary" aria-label="Object boundaries">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
									<path d="M4 14c0-5 3-9 8-9s8 4 8 9-3 6-8 6-8-1-8-6z" stroke-dasharray="2.2 2" />
								</svg>
							</button>
							<button type="button" class="select-toolbar__btn select-toolbar__objectmode-btn is-active" data-object-mode="extent" title="Using the object's bounding extent" aria-label="Object extent">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
									<rect x="3.5" y="6.5" width="17" height="11" rx="1" stroke-dasharray="2.2 2" />
								</svg>
							</button>
						</div>
					</div>
				</div>
			</div>

			<div class="results-panel is-collapsed" id="results-panel" aria-label="Results panel">
				<div class="results-panel__header">
					<button class="results-panel__title" type="button">
						<span id="results-panel__title-label"></span>
						<span id="results-panel__count"></span>
					</button>
					<div class="results-panel__actions">
						<div class="results-panel__actions-btns">
							<button type="button" class="results-panel__actions-btn" id="results-panel__clear-btn" aria-label="Clear selection">Clear</button>
							<button type="button" class="results-panel__actions-btn" id="results-panel__select-all-btn" aria-label="Select all">Select all</button>
							<button type="button" class="results-panel__actions-btn" id="results-panel__export-btn" aria-label="Export selection">Export</button>
						</div>
						<div class="results-panel__actions-dropdown" data-dropdown-root>
							<button type="button" class="collapse-btn results-panel__actions-dropdown__trigger" data-dropdown-trigger aria-haspopup="listbox" aria-expanded="false">
								<span class="results-panel__actions-dropdown__value" data-dropdown-value>Name</span>
								<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<polyline points="2,9 7,4 12,9" />
								</svg>
							</button>
							<ul class="results-panel__actions-dropdown__menu" data-dropdown-menu role="listbox" aria-label="Sort results by">
								<li class="results-panel__actions-dropdown__option is-selected" data-dropdown-option data-value="name" role="option" aria-selected="true">Name</li>
								<li class="results-panel__actions-dropdown__option" data-dropdown-option data-value="date" role="option" aria-selected="false">Date</li>
								<li class="results-panel__actions-dropdown__option" data-dropdown-option data-value="authorType" role="option" aria-selected="false">Author type</li>
								<li class="results-panel__actions-dropdown__option" data-dropdown-option data-value="documentType" role="option" aria-selected="false">Document type</li>
							</ul>
							<input type="hidden" id="results-panel__sort-value" name="resultsSortValue" value="name" />
						</div>
					</div>
					<button type="button" class="collapse-btn results-panel__collapse-btn" id="results-panel__collapse-btn">
						<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polyline points="12,5 7,10 2,5" />
						</svg>
					</button>
				</div>
				<div class="results-panel__list" id="results-panel__list"></div>
			</div>
			<div class="attribution-wrapper"><span>Leaflet | © CARTO |</span><img src="../img/svg/logos/ifl_logo.svg" /></div>
		</main>

		<footer class="slider-footer">
			<div class="slider-footer__label" id="time-slider-label">
				<span>Time range</span>
				<span class="slider-footer__range-value" id="range-value" aria-live="polite"></span>
			</div>
			<div id="time-slider" role="group" aria-labelledby="time-slider-label"></div>
		</footer>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
		<script src="../js/map/data/boundaries-topo.js"></script>
		<script type="module" src="../js/map/app.js"></script>
	</body>
</html>
